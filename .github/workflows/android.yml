name: Android Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-36
            build-tools;36.0.0
            cmdline-tools;latest
          accept-android-sdk-licenses: true

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7 --distribution-type all

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: staffflow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Run Roborazzi Screenshot Tests
        run: ./gradlew recordRoborazziDebug
        continue-on-error: true

      - name: Upload Roborazzi Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: staffflow-roborazzi-screenshots
          path: app/build/roborazzi/**/*.png
          retention-days: 7
          if-no-files-found: ignore